[toolchain]
anchor_version = "0.32.1"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
solana_gpt_oracle_scheduler = "HtxZqtUjDbMtkcs3e3BcBroJqXSaVKcyMjPS3QMJP8bd"

[programs.devnet]
solana_gpt_oracle_scheduler = "HtxZqtUjDbMtkcs3e3BcBroJqXSaVKcyMjPS3QMJP8bd"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
cron = "yarn run ts-node cron/cron.ts --cronName solana-gpt-oracle-cron --taskQueue CMreFdKxT5oeZhiX8nWTGz9PtXM1AMYTh6dGR2UzdtrA --walletPath ~/.config/solana/id.json --rpcUrl https://api.devnet.solana.com"
